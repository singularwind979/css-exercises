<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fix the Cascade</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="font-reading bg-cold-white">
    <p class="font-sky font-bold font-3 m-y-2">I'm just a paragraph with extra bold text!</p>
    <p class="font-sky font-bold font-2 m-y-1">I'm a smaller paragraph, also with extra bold text!</p>

    <button id="confirm-button" class="bg-emerald font-emerald b-cold-black b-1 m-y-1 p-x-1 font-bold">Confirm</button>
    <button id="cancel-button" class="bg-slate font-cold-black b-1 m-y-1 p-x-1 font-bold">Cancel</button>

    <div class="font-sky font-light font-2 m-y-1">I'm a div with thin text!</div>
    <div class="font-sky font-light font-2 m-y-1">I'm a div with thin text and a child div!
      <div class="font-sky font-bold font-1 m-y-1">I'm a smaller child div with extra bold text.</div>
    </div>
  </body>
</html>
