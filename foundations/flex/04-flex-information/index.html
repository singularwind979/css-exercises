<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="font-code">
    <div class="p-2 flexbox-col g-5">
      <div class="font-4 font-bold text-center">
        Information!
      </div>
      
      <div class="flexbox-row text-center g-2 main-center">
        <div class="max-size-7">
          <img class="max-size-5" src="./images/barberry.png" alt="barberry">
          <div class="p-1">This is a type of plant. We love this one.</div>
        </div>
        
        <div class="max-size-7">
          <img class="max-size-5" src="./images/chilli.png" alt="chili">
          <div class="p-1">This is another type of plant. Isn't it nice?</div>
        </div>
        
        <div class="max-size-7">
          <img class="max-size-5" src="./images/pepper.png" alt="pepper">
          <div class="p-1">We have so many plants. Yay plants.</div>
        </div>
        
        <div class="max-size-7">
          <img class="max-size-5" src="./images/saffron.png" alt="saffron">
          <div class="text p-1">I'm running out of things to say about plants.</div>
        </div>

      </div>
    </div>

    <!-- disregard this section, it's here to give attribution to the creator of these icons -->
    <div class="bg-zinc pos-viewport bottom left right flexbox-row main-center cross-center size-y-3">
      <div>Icons made by <a href="https://www.flaticon.com/authors/icongeek26" title="Icongeek26">Icongeek26</a> from <a href="https://www.flaticon.com/" title="Flaticon">www.flaticon.com</a></div>
    </div>
  </body>
</html>
