<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Information</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="section flexbox-col gap-elem-wide">
      <div class="title">Information!</div>
      
      <div class="cards flexbox-row items-center gap-elem">
        <div class="card flexbox-col gap-elem-tight">
          <img class="card-img self-center" src="./images/barberry.png" alt="barberry">
          <div class="card-text">This is a type of plant. We love this one.</div>
        </div>
        
        <div class="card flexbox-col gap-elem-tight">
          <img class="card-img self-center" src="./images/chilli.png" alt="chili">
          <div class="card-text">This is another type of plant. Isn't it nice?</div>
        </div>
        
        <div class="card flexbox-col gap-elem-tight">
          <img class="card-img self-center" src="./images/pepper.png" alt="pepper">
          <div class="card-text">We have so many plants. Yay plants.</div>
        </div>
        
        <div class="card flexbox-col gap-elem-tight">
          <img class="card-img self-center" src="./images/saffron.png" alt="saffron">
          <div class="card-text">I'm running out of things to say about plants.</div>
        </div>

      </div>
    </div>

    <!-- disregard this section, it's here to give attribution to the creator of these icons -->
    <div class="footer">
      <div>Icons made by <a href="https://www.flaticon.com/authors/icongeek26" title="Icongeek26">Icongeek26</a> from <a href="https://www.flaticon.com/" title="Flaticon">www.flaticon.com</a></div>
    </div>
  </body>
</html>
