<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAYOUT</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body class="font-ui flexbox-col main-spaced">
    <div class="header bg-slate p-y-5 p-x-4 flexbox-row main-spaced">
      <ul class="left-links flexbox-row g-4">
        <li><a class="font-zinc" href="#">About</a></li>
        <li><a class="font-zinc" href="#">Store</a></li>
      </ul>
      <ul class="right-links flexbox-row g-4">
        <li><a class="font-zinc" href="#">Profile</a></li>
        <li><a class="font-zinc" href="#">Settings</a></li>
      </ul>
    </div>
    
    <div class="content flexbox-col cross-center g-5">
      <img class="size-x-10" src="./logo.png" alt="Project logo. Represents odin with the project name.">
      <div class="input">
        <input type="text" class="size-x-10 b-1 b-zinc r-6 p-y-2 p-x-5">
      </div>
      <div class="buttons flexbox-row main-center g-4">
        <button class="bg-zinc r-5 p-y-2 p-x-3">Do the thing!</button>
        <button class="bg-zinc r-5 p-y-2 p-x-3">Do the other thing!</button>
      </div>
    </div>
    
    <div class="footer bg-slate p-y-5 p-x-4 flexbox-row main-spaced">
      <ul class="left-links flexbox-row g-4">
        <li><a class="font-zinc" href="#">Advertising</a></li>
        <li><a class="font-zinc" href="#">Business</a></li>
      </ul>
      <ul class="right-links flexbox-row g-4">
        <li><a class="font-zinc" href="#">Privacy</a></li>
        <li><a class="font-zinc" href="#">Terms</a></li>
      </ul>
    </div>
  </body>
</html>
