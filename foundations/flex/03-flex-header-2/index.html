<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Header 2</title>
    <link rel="stylesheet" href="reset.css">
    <link rel="stylesheet" href="layout.css">
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div class="header flexbox-row items-spaced">

      <div class="header-left flexbox-row gap-elem">
        <div class="logo flex-never self-center">LOGO</div>
        <ul class="links flexbox-row items-centering gap-elem-wide">
          <li><a href="https://google.com">link-one</a></li>
          <li><a href="https://google.com">link-two</a></li>
          <li><a href="https://google.com">link-three</a></li>
        </ul>
      </div>

      <div class="header-right flexbox-row gap-elem-wide">
        <button class="notifications self-center">1 new notification</button>
        <div class="profile-image flex-never self-center"></div>
      </div>
    </div>

  </body>
</html>
