<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Flex Header</title>
    <link rel="stylesheet" href="style.css">
  </head>
  <body>
    <div id="header" class="font-code bg-cold-white p-1 flexbox-row main-spaced cross-center">

      <ul id="header-l-links" class="flexbox-row g-2">
        <li><a class="bg-rose font-rose font-2 p-1" href="#">ONE</a></li>
        <li><a class="bg-amber font-amber font-2 p-1" href="#">TWO</a></li>
        <li><a class="bg-emerald font-emerald font-2 p-1" href="#">THREE</a></li>
      </ul>

      <div id="header-logo" class="bg-stone b-stone font-stone font-5 font-bold p-y-1 p-x-6">LOGO</div>
      
      <ul id="header-r-links" class="flexbox-row g-2">
        <li><a class="bg-sky font-sky font-2 p-1" href="#">FOUR</a></li>
        <li><a class="bg-violet font-violet font-2 p-1" href="#">FIVE</a></li>
        <li><a class="bg-fuchsia font-fuchsia font-2 p-1" href="#">SIX</a></li>
      </ul>

    </div>
  </body>
</html>
