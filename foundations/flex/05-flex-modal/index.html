<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="main.css">
    <title>Modal</title>
  </head>
  <body class="flexbox-centering">
    <div class="modal flexbox-row gap-elem-wide corner-card p-12">
      <div class="icon corner-pill">!</div>
      <div class="message flexbox-col gap-elem">
        <div class="header flexbox-row items-spaced">
          <div class="header-text">
            Are you sure you want to do that?
          </div>
          <button class="close corner-pill">✖</button>
        </div>
        <div class="content">
          Lorem ipsum dolor sit amet consectetur adipisicing elit. Pariatur excepturi id soluta, numquam minima rerum doloremque eveniet aspernatur beatae commodi. Cupiditate recusandae ad repellendus quidem consectetur sequi amet aspernatur cumque!
        </div>
        <div class="buttons">
          <button class="continue corner-control b-1 p-x-12 p-y-8">Continue</button>
          <button class="cancel corner-control b-1 p-x-12 p-y-8">Cancel</button>
        </div>
      </div>
    </div>
  </body>
</html>
